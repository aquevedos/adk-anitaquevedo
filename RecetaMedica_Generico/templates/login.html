<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Portal Médico - Farmacias Arrocha</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #002a54;
            --surface: rgba(0, 75, 147, 0.3);
            --surface-card: rgba(0, 75, 147, 0.45);
            --border: rgba(255, 255, 255, 0.15);
            --border-hover: rgba(255, 184, 0, 0.6);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --primary: #ffb800;
            --primary-glow: rgba(255, 184, 0, 0.35);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: 
                radial-gradient(at 10% 10%, rgba(45, 212, 191, 0.1) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .login-card {
            background: var(--surface-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: clamp(2rem, 5vw, 3rem);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: var(--transition);
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 20px 50px var(--primary-glow);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--primary) 0%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #ffb800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
            transition: var(--transition);
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            background: rgba(0, 20, 40, 0.8);
        }

        .input-group input:focus + .input-icon {
            color: var(--primary);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, #ffd700 100%);
            color: #002a54;
            border: none;
            padding: 0.9rem;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 100px;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 4px 15px var(--primary-glow);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 184, 0, 0.5);
            filter: brightness(1.05);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-container">
        <span class="logo-icon">➕</span>
        <span class="logo-text">Portal Médico</span>
    </div>
    <h2 class="login-title">Iniciar Sesión</h2>
    <p class="login-subtitle">Ingrese sus credenciales de acceso</p>
    
    <div id="loginError" class="login-error">
        ⚠️ Usuario o contraseña incorrectos
    </div>

    <form id="loginForm">
        <div class="input-group">
            <label for="username">Usuario</label>
            <div class="input-field-wrapper">
                <input type="text" id="username" required placeholder="admin" autocomplete="username">
                <span class="input-icon">👤</span>
            </div>
        </div>
        
        <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-field-wrapper">
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                <span class="input-icon">🔒</span>
            </div>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
            <span>Ingresar</span>
            <span>➔</span>
        </button>
    </form>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const btnLogin = document.getElementById('btnLogin');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.style.display = 'none';
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        btnLogin.disabled = true;
        const originalText = btnLogin.innerHTML;
        btnLogin.innerHTML = '⏳ Verificando...';

        const formData = new FormData();
        const isServerless = window.location.port !== '8000' && window.location.port !== '8085';
        
        let loginUrl = '/api/login';
        if (isServerless) {
            formData.append('action', 'login');
            loginUrl = window.location.href;
        } else {
            formData.append('username', username);
            formData.append('password', password);
        }

        if (isServerless) {
            formData.append('username', username);
            formData.append('password', password);
        }

        try {
            const res = await fetch(loginUrl, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if (res.ok && data.status === 'success') {
                window.location.reload();
            } else {
                loginError.style.display = 'flex';
                loginError.textContent = '⚠️ ' + (data.message || 'Error de credenciales');
            }
        } catch (err) {
            loginError.style.display = 'flex';
            loginError.textContent = '⚠️ Error de red al conectar con el servidor';
        } finally {
            btnLogin.disabled = false;
            btnLogin.innerHTML = originalText;
        }
    });
</script>
</body>
</html>
